name: V22 Nightly Validation Review

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read

concurrency:
  group: v22-nightly-validation-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Neon driver
        run: python -m pip install -r requirements-v22.txt
      - name: Persist 24-hour validation report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/v22_runtime_report.py --window-hours 24 --report-type NIGHTLY_VALIDATION
