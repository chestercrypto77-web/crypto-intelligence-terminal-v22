name: V22 Runtime Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "26 * * * *"

permissions:
  contents: read

concurrency:
  group: v22-runtime-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Neon driver
        run: python -m pip install -r requirements-v22.txt
      - name: Check Neon for genuine cycle coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/v22_runtime_report.py --window-hours 6 --report-type HOURLY_WATCHDOG --fail-on-stale
