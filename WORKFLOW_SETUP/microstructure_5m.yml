name: V22 5-Minute Free Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: v22-free-5m-validation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Neon driver
        run: python -m pip install -r requirements-v22.txt
      - name: Run live 5-minute Brain cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          V22_LIVE_HTTP_TIMEOUT_SECONDS: "5"
        run: python scripts/v22_github_cycle.py --cycle 5m --workflow-name "V22 5-Minute Free Validation"
