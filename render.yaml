services:
  - type: worker
    name: crypto-v22-brain
    runtime: docker
    dockerfilePath: ./Dockerfile.v22
    dockerCommand: python -m v22.brain.supervisor
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-v22-postgres
          property: connectionString
      - key: V22_MODE
        value: shadow
      - key: V22_V21_BRIDGE
        value: "1"
  - type: web
    name: crypto-v22-health
    runtime: docker
    dockerfilePath: ./Dockerfile.v22
    dockerCommand: python -m v22.health_server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-v22-postgres
          property: connectionString
databases:
  - name: crypto-v22-postgres
